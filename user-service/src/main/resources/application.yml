server:
  port: 8080

logging:
  level:
    root: INFO
  pattern:
    correlation: "[ %X{userId:-}, %X{ traceId:- }, %X{ spanId:- } ]"
  include-application-name: false

spring:
  application:
    name: user-service
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:h2:mem:devdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  tracing:
    sampling:
      probability: 1
    baggage:
      correlation:
        fields:
          - userId # Propagates the baggage to the MDC
  #      remote-fields:
  #        - userId # Propagates baggage over the network if B3 propagation is used. If W3C propagation is used, then this is not needed.
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
